level: error
scope: text

link: 'https://developers.google.com/style/abbreviations#periods'
description: |-
  Don't use periods with acronyms or initialisms. They aren't necessary.
  Screen readers read letters in fully uppercased words individually.
message: >-
  Don't use periods with acronyms or initialisms such as '%s'.

extends: existence
nonword: true
tokens:
  - '\b(?:[A-Z]\.){3,}'

action:
  name: edit
  params:
    - regex
    - '\.'
    - ''
