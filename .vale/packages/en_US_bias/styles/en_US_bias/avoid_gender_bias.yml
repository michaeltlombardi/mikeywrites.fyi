# Borrowed from and extending Microsoft.GenderBias and Alex.Gendered
level: error
scope: text

description: |-
  Avoid using gendered language where possible. Using gendered language raises
  issues of inclusivity and bias.
message: >-
  Consider using '%s' instead of '%s'.

extends: substitution
ignorecase: true
